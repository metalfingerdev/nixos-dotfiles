##########################################################################
# FONTS
##########################################################################

# JetBrains Mono comes from modules/features/theme.nix. Nerd Font icons (yazi,
# fastfetch, prompts) still render: kitty bundles Symbols Nerd Font Mono as a
# fallback, so no patched font is needed.
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Keep ligatures, but split them under the cursor so you can see what you edit
disable_ligatures cursor

# macOS-style text rendering: slightly heavier, crisper glyphs on a dark background
text_composition_strategy 1.7 30

##########################################################################
# WINDOW
##########################################################################

# Hyprland draws the rounded corners and the blur; kitty only adds breathing room
window_padding_width 12 16
background_opacity   0.85
dynamic_background_opacity yes

confirm_os_window_close 0

# Splits: a thin hairline, focus shown in the accent colour like a macOS focus ring
window_border_width  1pt
draw_minimal_borders yes
inactive_text_alpha  0.9

##########################################################################
# CURSOR
##########################################################################

# A thin accent-coloured beam that fades in and out, like the macOS insertion point
cursor_shape               beam
cursor_beam_thickness      2
cursor_blink_interval      0.6 ease-in-out
cursor_stop_blinking_after 10

# A short trail when the cursor jumps, so the eye can follow it
cursor_trail                 3
cursor_trail_decay           0.08 0.3
cursor_trail_start_threshold 3

##########################################################################
# TABS
##########################################################################

# Rounded tabs, centred along the top, only once there is more than one
tab_bar_edge          top
tab_bar_align         center
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_min_tabs      2
tab_bar_margin_width  8.0
tab_bar_margin_height 6.0 2.0
tab_title_max_length  32
tab_title_template    "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
active_tab_font_style   normal
inactive_tab_font_style normal

##########################################################################
# BEHAVIOUR
##########################################################################

scrollback_lines      10000
strip_trailing_spaces smart
url_style             straight

# No beep: flag the window and its tab instead
enable_audio_bell   no
window_alert_on_bell yes
bell_on_tab         "● "

##########################################################################
# COLOURS: macOS dark mode
##########################################################################

# Apple's system colours (dark appearance); the bright variants are their
# Increase Contrast versions. Selection is macOS's blue text highlight.
foreground           #E5E5EA
background           #1C1C1E
selection_foreground none
selection_background #3F638B
cursor               #0A84FF
cursor_text_color    background
url_color            #409CFF

active_border_color   #0A84FF
inactive_border_color #3A3A3C
bell_border_color     #FF9F0A

tab_bar_background      none
active_tab_foreground   #FFFFFF
active_tab_background   #3A3A3C
inactive_tab_foreground #8E8E93
inactive_tab_background #252527

# black
color0  #3A3A3C
color8  #8E8E93
# red
color1  #FF453A
color9  #FF6961
# green
color2  #32D74B
color10 #30DB5B
# yellow
color3  #FFD60A
color11 #FFD426
# blue
color4  #0A84FF
color12 #409CFF
# magenta (system purple)
color5  #BF5AF2
color13 #DA8FFF
# cyan
color6  #64D2FF
color14 #70D7FF
# white
color7  #D1D1D6
color15 #FFFFFF

##########################################################################
# OPTIMIZATIONS FOR YAZI IMAGE PREVIEWS & WAYLAND
##########################################################################

# Force Kitty to run natively under Wayland instead of falling back to XWayland
linux_display_server wayland

# Prevent font characters and image grids from tearing at high frame rates
sync_to_monitor yes

# Clean up redraw behaviors when yazi updates columns or closes an image panel
repaint_delay 8
input_delay   2

# Allow terminal programs like Yazi to change the window title dynamically
allow_remote_control yes
listen_on unix:@mykitty
